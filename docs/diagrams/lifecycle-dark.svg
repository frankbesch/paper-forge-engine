<svg viewBox="0 0 360 734" xmlns="http://www.w3.org/2000/svg" role="img" font-family='"QuoinMono", ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace'>
<title>One source, capture to console</title>
<desc>pf.py capture preserves a source byte for byte with its SHA-256 and copies the workbook templates. A route sets how deep it goes: capture, interpret, critique, verify, or develop. The workbook has seven stages, Read to Discover. An assessment records relevance and leverage per endeavor; the dispositions Apply, Test, Hold, and Retire need the named approver. Apply writes an export package and an append-only receipt and never writes into the target. Validate checks schemas, checksums, workbooks, IDs, the registry order, and the ledgers. Build renders one library.html that makes no network requests and is byte-identical for the same inputs. The engine makes no model calls.</desc>
<style>@font-face{font-family:"QuoinMono";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinMono";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinSans";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"QuoinSans";font-weight:600;src:url(data:font/woff2;base64,) format("woff2")}</style>
