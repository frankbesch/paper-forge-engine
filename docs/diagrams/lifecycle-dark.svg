<text x="16" y="700" font-size="12" fill="#A8A296" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>The engine makes no model calls; a draft assessment comes</text>
<text x="16" y="717" font-size="12" fill="#A8A296" font-family='"QuoinSans", -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif'>in as JSON from any assistant.</text>
